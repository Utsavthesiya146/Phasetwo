name: PhaseTwo iOS Build & Verification

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-ios:
    name: Build & Verify iOS Release
    runs-on: macos-14
    timeout-minutes: 60

    steps:
      - name: 1. Checkout Repository
        uses: actions/checkout@v4

      - name: 2. Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: 3. Verify Environment
        run: |
          flutter --version
          dart --version
          xcodebuild -version

      - name: 4. Install Dependencies
        run: flutter pub get

      - name: 5. Analyze Code
        run: flutter analyze --no-fatal-infos

      - name: 6. Run Automated Tests
        run: flutter test

      - name: 6.5. Install CocoaPods Dependencies
        run: |
          if [ ! -f ios/Flutter/Generated.xcconfig ]; then
            echo "FLUTTER_ROOT=$FLUTTER_ROOT" > ios/Flutter/Generated.xcconfig
            echo "FLUTTER_APPLICATION_PATH=$(pwd)" >> ios/Flutter/Generated.xcconfig
            echo "FLUTTER_TARGET=lib/main.dart" >> ios/Flutter/Generated.xcconfig
            echo "FLUTTER_BUILD_DIR=build" >> ios/Flutter/Generated.xcconfig
            echo "FLUTTER_BUILD_NAME=1.0.0" >> ios/Flutter/Generated.xcconfig
            echo "FLUTTER_BUILD_NUMBER=1" >> ios/Flutter/Generated.xcconfig
          fi
          cd ios
          pod install --repo-update
          cd ..

      - name: 7. Build Unsigned iOS Release
        env:
          CODE_SIGNING_ALLOWED: "NO"
          CODE_SIGNING_REQUIRED: "NO"
          CODE_SIGN_IDENTITY: ""
        run: |
          set -o pipefail
          flutter build ios --release --no-codesign 2>&1 | tee build_output.log

      - name: Diagnostic Annotations On Build Failure
        if: failure()
        run: |
          if [ -f build_output.log ]; then
            ERROR_SNIPPET=$(tail -n 25 build_output.log | tr '\n' ' ')
            echo "::error title=iOS Build Log::$ERROR_SNIPPET"
          fi

      - name: 8. Package Unsigned IPA Artifact
        run: |
          echo "=== Searching for compiled Runner.app ==="
          APP_PATH=$(find build -name "Runner.app" -type d | head -n 1)
          echo "Discovered compiled Runner.app at: ${APP_PATH}"

          if [ -z "$APP_PATH" ]; then
            echo "::error title=Runner App Not Found::No Runner.app found in build directory"
            find build -maxdepth 4
            exit 1
          fi

          mkdir -p build/ios/Payload
          cp -R "$APP_PATH" build/ios/Payload/
          cd build/ios
          zip -qr -y PhaseTwo-iOS-Unsigned-Release.ipa Payload
          IPA_SIZE=$(ls -lh PhaseTwo-iOS-Unsigned-Release.ipa | awk '{print $5}')
          echo "::notice title=Unsigned IPA Artifact::PhaseTwo-iOS-Unsigned-Release.ipa created successfully with size ${IPA_SIZE} at $(pwd)/PhaseTwo-iOS-Unsigned-Release.ipa"
          cd ../..

      - name: 9. Upload Unsigned iOS IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: PhaseTwo-iOS-Unsigned-Release-IPA
          path: build/ios/PhaseTwo-iOS-Unsigned-Release.ipa
          retention-days: 14

      - name: 9b. Upload Compiled Runner.app Bundle
        uses: actions/upload-artifact@v4
        with:
          name: PhaseTwo-iOS-Runner-App
          path: "build/**/Runner.app"
          if-no-files-found: ignore
          retention-days: 14

      - name: 10. Optional Apple Signing & Export
        env:
          APPLE_CERT_B64: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
          APPLE_CERT_PASS: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_PROV_B64: ${{ secrets.APPLE_PROVISIONING_PROFILE_BASE64 }}
        run: |
          if [ -z "$APPLE_CERT_B64" ]; then
            echo "NOTICE: No Apple Developer signing credentials supplied in repository secrets."
            echo "Unsigned iOS release bundle packaged successfully as PhaseTwo-iOS-Unsigned-Release.ipa."
            exit 0
          fi
          echo "Setting up temporary Apple keychain..."
          CERT_PATH=$RUNNER_TEMP/build_cert.p12
          PP_PATH=$RUNNER_TEMP/build_pp.mobileprovision
          KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db

          echo -n "$APPLE_CERT_B64" | base64 --decode -o $CERT_PATH
          echo -n "$APPLE_PROV_B64" | base64 --decode -o $PP_PATH

          security create-keychain -p "phasetwo_temp" $KEYCHAIN_PATH
          security set-keychain-settings -lut 21600 $KEYCHAIN_PATH
          security unlock-keychain -p "phasetwo_temp" $KEYCHAIN_PATH

          security import $CERT_PATH -P "$APPLE_CERT_PASS" -A -t cert -f pkcs12 -k $KEYCHAIN_PATH
          security list-keychain -d user -s $KEYCHAIN_PATH
          security set-key-partition-list -S apple-tool:,apple: -s -k "phasetwo_temp" $KEYCHAIN_PATH

          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          cp $PP_PATH ~/Library/MobileDevice/Provisioning\ Profiles/

          flutter build ipa --release

      - name: 11. Upload Signed IPA (If Generated)
        uses: actions/upload-artifact@v4
        with:
          name: PhaseTwo-iOS-Signed-Production-IPA
          path: build/ios/ipa/*.ipa
          if-no-files-found: ignore
          retention-days: 30
