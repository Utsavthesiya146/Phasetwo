name: PhaseTwo iOS Build & App Store Release

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:
    inputs:
      upload_to_app_store:
        description: 'Upload signed IPA to App Store Connect / TestFlight'
        required: true
        type: boolean
        default: true

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-ios:
    name: Build & Verify iOS Release
    runs-on: macos-14
    timeout-minutes: 60

    steps:
      - name: 1. Checkout Repository
        uses: actions/checkout@v4

      - name: 2. Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: 3. Verify Environment
        run: |
          flutter --version
          dart --version
          xcodebuild -version

      - name: 4. Install Dependencies
        run: flutter pub get

      - name: 5. Analyze Code
        run: flutter analyze --no-fatal-infos

      - name: 6. Run Automated Tests
        run: flutter test

      - name: 6.5. Install CocoaPods Dependencies
        run: |
          if [ ! -f ios/Flutter/Generated.xcconfig ]; then
            echo "FLUTTER_ROOT=$FLUTTER_ROOT" > ios/Flutter/Generated.xcconfig
            echo "FLUTTER_APPLICATION_PATH=$(pwd)" >> ios/Flutter/Generated.xcconfig
            echo "FLUTTER_TARGET=lib/main.dart" >> ios/Flutter/Generated.xcconfig
            echo "FLUTTER_BUILD_DIR=build" >> ios/Flutter/Generated.xcconfig
            echo "FLUTTER_BUILD_NAME=1.0.0" >> ios/Flutter/Generated.xcconfig
            echo "FLUTTER_BUILD_NUMBER=1" >> ios/Flutter/Generated.xcconfig
          fi
          cd ios
          pod install --repo-update
          cd ..

      - name: 7. Apple Distribution Signing & Production IPA Export
        env:
          APPLE_CERT_B64: ${{ secrets.APPLE_CERTIFICATE_BASE64 || secrets.BUILD_CERTIFICATE_BASE64 }}
          APPLE_CERT_PASS: ${{ secrets.APPLE_CERTIFICATE_PASSWORD || secrets.P12_PASSWORD }}
          APPLE_PROV_B64: ${{ secrets.APPLE_PROVISIONING_PROFILE_BASE64 || secrets.BUILD_PROVISION_PROFILE_BASE64 }}
        run: |
          if [ -n "$APPLE_CERT_B64" ] && [ -n "$APPLE_PROV_B64" ]; then
            echo "Apple Developer signing credentials detected! Setting up production signing..."
            CERT_PATH=$RUNNER_TEMP/build_cert.p12
            PP_PATH=$RUNNER_TEMP/build_pp.mobileprovision
            KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db

            echo -n "$APPLE_CERT_B64" | base64 --decode -o $CERT_PATH
            echo -n "$APPLE_PROV_B64" | base64 --decode -o $PP_PATH

            security create-keychain -p "phasetwo_temp" $KEYCHAIN_PATH
            security set-keychain-settings -lut 21600 $KEYCHAIN_PATH
            security unlock-keychain -p "phasetwo_temp" $KEYCHAIN_PATH

            security import $CERT_PATH -P "$APPLE_CERT_PASS" -A -t cert -f pkcs12 -k $KEYCHAIN_PATH
            security list-keychain -d user -s $KEYCHAIN_PATH
            security set-key-partition-list -S apple-tool:,apple: -s -k "phasetwo_temp" $KEYCHAIN_PATH

            mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
            cp $PP_PATH ~/Library/MobileDevice/Provisioning\ Profiles/

            echo "Building signed iOS archive and exporting IPA..."
            flutter build ipa --release --export-options-plist=ios/ExportOptions.plist
            echo "SIGNED_BUILD=true" >> $GITHUB_ENV
          else
            echo "No Apple signing credentials provided. Falling back to unsigned build packaging..."
            echo "SIGNED_BUILD=false" >> $GITHUB_ENV
          fi

      - name: 8. Fallback Unsigned Build Packaging (If No Signing Credentials)
        if: env.SIGNED_BUILD == 'false'
        env:
          CODE_SIGNING_ALLOWED: "NO"
          CODE_SIGNING_REQUIRED: "NO"
          CODE_SIGN_IDENTITY: ""
        run: |
          set -o pipefail
          flutter build ios --release --no-codesign 2>&1 | tee build_output.log

          APP_PATH=$(find build -name "Runner.app" -type d | head -n 1)
          if [ -z "$APP_PATH" ]; then
            echo "::error title=Runner App Not Found::No Runner.app found in build directory"
            exit 1
          fi

          mkdir -p build/ios/Payload
          cp -R "$APP_PATH" build/ios/Payload/
          cd build/ios
          zip -qr -y PhaseTwo-iOS-Unsigned-Release.ipa Payload
          cd ../..

      - name: 9. Upload Unsigned IPA Artifact
        if: env.SIGNED_BUILD == 'false'
        uses: actions/upload-artifact@v4
        with:
          name: PhaseTwo-iOS-Unsigned-Release-IPA
          path: build/ios/PhaseTwo-iOS-Unsigned-Release.ipa
          retention-days: 14

      - name: 10. Upload Signed Production IPA Artifact
        if: env.SIGNED_BUILD == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: PhaseTwo-iOS-Signed-Production-IPA
          path: build/ios/ipa/*.ipa
          retention-days: 30

      - name: 11. TestFlight & App Store Connect Automated Delivery
        if: env.SIGNED_BUILD == 'true' && (github.event_name != 'workflow_dispatch' || github.event.inputs.upload_to_app_store == 'true')
        env:
          APP_STORE_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_KEY_ID || secrets.APP_STORE_KEY_ID }}
          APP_STORE_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ISSUER_ID || secrets.APP_STORE_ISSUER_ID }}
          APP_STORE_KEY_B64: ${{ secrets.APP_STORE_CONNECT_API_KEY_BASE64 || secrets.APP_STORE_KEY_B64 }}
        run: |
          if [ -z "$APP_STORE_KEY_ID" ] || [ -z "$APP_STORE_ISSUER_ID" ] || [ -z "$APP_STORE_KEY_B64" ]; then
            echo "::warning title=Missing App Store Credentials::App Store Connect API key secrets are missing. Skipping automated upload."
            echo "Configure the following GitHub Secrets to enable automatic TestFlight/App Store upload:"
            echo " - APP_STORE_CONNECT_API_KEY_KEY_ID"
            echo " - APP_STORE_CONNECT_API_KEY_ISSUER_ID"
            echo " - APP_STORE_CONNECT_API_KEY_BASE64"
            exit 0
          fi

          SIGNED_IPA=$(find build/ios/ipa -name "*.ipa" | head -n 1)
          if [ -z "$SIGNED_IPA" ]; then
            echo "::error title=No Signed IPA::No signed IPA file found in build/ios/ipa."
            exit 1
          fi

          echo "Setting up App Store Connect API Key..."
          mkdir -p ~/.appstoreconnect/private_keys ~/.private_keys
          echo -n "$APP_STORE_KEY_B64" | base64 --decode -o ~/.appstoreconnect/private_keys/AuthKey_${APP_STORE_KEY_ID}.p8
          cp ~/.appstoreconnect/private_keys/AuthKey_${APP_STORE_KEY_ID}.p8 ~/.private_keys/

          echo "Validating application binary with Apple App Store Connect..."
          xcrun altool --validate-app --type ios -f "$SIGNED_IPA" --apiKey "$APP_STORE_KEY_ID" --apiIssuer "$APP_STORE_ISSUER_ID"

          echo "Uploading $SIGNED_IPA to Apple App Store Connect / TestFlight..."
          xcrun altool --upload-app --type ios -f "$SIGNED_IPA" --apiKey "$APP_STORE_KEY_ID" --apiIssuer "$APP_STORE_ISSUER_ID"

          echo "::notice title=App Store Upload Successful::App successfully uploaded to App Store Connect / TestFlight!"
