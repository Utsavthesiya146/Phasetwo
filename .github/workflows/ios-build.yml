name: PhaseTwo iOS Release & TestFlight CI/CD

on:
  push:
    branches:
      - main
      - master
    paths-ignore:
      - '**.md'
      - 'docs/**'
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:
    inputs:
      distribute_testflight:
        description: 'Upload signed build to Apple TestFlight (Requires Secrets)'
        required: false
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-ios:
    name: Build & Verify iOS Release
    runs-on: macos-14
    timeout-minutes: 60

    steps:
      - name: 1. Checkout Repository
        uses: actions/checkout@v4

      - name: 2. Set up Flutter Environment
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: 3. Verify Flutter & Dart Installation
        run: |
          flutter --version
          dart --version
          xcodebuild -version

      - name: 4. Install Flutter Dependencies
        run: flutter pub get

      - name: 5. Execute Static Code Analysis
        run: flutter analyze --no-fatal-infos

      - name: 6. Run Automated Test Suite
        run: flutter test

      - name: 7. Cache CocoaPods
        uses: actions/cache@v4
        with:
          path: ios/Pods
          key: ${{ runner.os }}-pods-${{ hashFiles('ios/Podfile', 'pubspec.lock') }}
          restore-keys: |
            ${{ runner.os }}-pods-

      - name: 8. Install CocoaPods Dependencies
        run: |
          cd ios
          pod install --repo-update
          cd ..

      - name: 9. Build Unsigned iOS Bundle (Compilation & Architecture Verification)
        run: |
          flutter build ios --release --no-codesign

      - name: 10. Package Unsigned Payload Artifact
        run: |
          mkdir -p build/ios/unsigned_payload/Payload
          cp -r build/ios/iphoneos/Runner.app build/ios/unsigned_payload/Payload/
          cd build/ios/unsigned_payload
          zip -r ../PhaseTwo-unsigned.ipa Payload
          cd ../../..

      - name: 11. Configure Apple Signing Credentials (If Secrets Present)
        id: apple-signing
        if: env.APPLE_CERTIFICATE_BASE64 != ''
        env:
          APPLE_CERTIFICATE_BASE64: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_PROVISIONING_PROFILE_BASE64: ${{ secrets.APPLE_PROVISIONING_PROFILE_BASE64 }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD || 'phasetwo_temporary_keychain' }}
        run: |
          echo "Setting up temporary Apple keychain..."
          CERT_PATH=$RUNNER_TEMP/build_cert.p12
          PP_PATH=$RUNNER_TEMP/build_pp.mobileprovision
          KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db

          # Decode certificates
          echo -n "$APPLE_CERTIFICATE_BASE64" | base64 --decode -o $CERT_PATH
          echo -n "$APPLE_PROVISIONING_PROFILE_BASE64" | base64 --decode -o $PP_PATH

          # Create temporary keychain
          security create-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
          security set-keychain-settings -lut 21600 $KEYCHAIN_PATH
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH

          # Import certificate into keychain
          security import $CERT_PATH -P "$APPLE_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k $KEYCHAIN_PATH
          security list-keychain -d user -s $KEYCHAIN_PATH
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH

          # Install provisioning profile
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          cp $PP_PATH ~/Library/MobileDevice/Provisioning\ Profiles/
          echo "Apple Signing Setup Completed."

      - name: 12. Build Signed IPA (If Signing Configured)
        if: env.APPLE_CERTIFICATE_BASE64 != ''
        env:
          APPLE_CERTIFICATE_BASE64: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
        run: |
          flutter build ipa --release

      - name: 13. Upload Unsigned IPA / App Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: PhaseTwo-iOS-Unsigned-Release
          path: build/ios/PhaseTwo-unsigned.ipa
          retention-days: 14

      - name: 14. Upload Signed IPA (If Built)
        if: env.APPLE_CERTIFICATE_BASE64 != ''
        uses: actions/upload-artifact@v4
        with:
          name: PhaseTwo-iOS-Production-Signed-IPA
          path: build/ios/ipa/*.ipa
          retention-days: 30

      - name: 15. Deliver to Apple TestFlight (Optional)
        if: ${{ inputs.distribute_testflight && secrets.APP_STORE_CONNECT_API_KEY != '' }}
        env:
          API_KEY: ${{ secrets.APP_STORE_CONNECT_API_KEY }}
          KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        run: |
          echo "Uploading signed IPA to App Store Connect / TestFlight..."
          mkdir -p ~/.appstoreconnect/private_keys
          echo -n "$API_KEY" | base64 --decode -o ~/.appstoreconnect/private_keys/AuthKey_${KEY_ID}.p8
          xcrun altool --upload-app -f build/ios/ipa/*.ipa --type ios --apiKey "$KEY_ID" --apiIssuer "$ISSUER_ID"
